[metadata]
name = srtd-nts
version = 0.1.0
description = Topological representation analysis scores: SRTD, SRTD-lite, and NTS.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.23
    scipy>=1.9

[options.extras_require]
full =
    ripserplusplus @ git+https://github.com/ArGintum/RipserZeros.git@bac8a96f56e9e3ed46202323accbeeee11c4b54c

[options.packages.find]
where = src
